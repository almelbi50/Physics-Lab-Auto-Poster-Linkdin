name: LinkedIn - Post Old Archive Articles

on:
  schedule:
    # يعمل مرة واحدة يومياً الساعة 1:00 ظهراً بتوقيت UTC (عدّلها بما يناسب جمهورك)
    - cron: '0 13 * * *'
  workflow_dispatch: # للتشغيل اليدوي للتجربة الفورية

jobs:
  post-old-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # مهم جداً لتحديث الذاكرة ومنع التكرار

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: pip install requests feedparser

    - name: Run Script for Old Posts
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      run: python post_to_linkedin.py --old

  - name: Commit and Push Database Changes
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        touch posted_links.txt
        git add posted_links.txt
        git commit -m "Update posted links database [skip ci]" || exit 0
        git push
